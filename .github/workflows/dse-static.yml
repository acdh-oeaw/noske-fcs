name: dse-static
on:
  workflow_dispatch:
    inputs:
      edition:
        description: digital edition name
        required: false
        type: string
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.4.0
    - name: extract existing data
      run: |
        cd dse-static-pipeline
        ./extract_existing.sh
        echo "### Existing data:"
        ls -1 data
    - name: create missing verticals
      run: |
        cd dse-static-pipeline
        PARAM="-s"
        if [ -n "${{ inputs.edition }}" ] ; then 
          PARAM="-e ${{ inputs.edition }}"
        fi
        uv run create_verticals.py -c config_sample.yaml $PARAM
    - name: compile corpora
      run: |
        cd dse-static-pipeline
        ./compile_corp.sh
    - name: build updated image
      run: |
        cd dse-static-pipeline
        ./build_image.sh
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: docker push
      run: docker push ghcr.io/acdh-oeaw/noske-fcs-dse-static:latest


